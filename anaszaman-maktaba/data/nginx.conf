# Serves the Maktaba shell and proxies every kiwix-serve endpoint on the same origin,
# so the reader iframe stays same-origin (needed for styling, contents and link handling).
server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's embedded DNS: re-resolve kiwix_web_1 if the Kiwix container restarts with a new IP.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $kiwix http://kiwix_web_1:8080;

    location = / { try_files /index.html =404; add_header Cache-Control "no-cache"; }
    location ~ ^/(app\.js|app\.css|reader\.css|khan\.css|manifest\.webmanifest|icon\.svg|icon-180\.png|icon-512\.png)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        proxy_pass $kiwix;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_buffering on;
        proxy_read_timeout 120s;
    }
}
