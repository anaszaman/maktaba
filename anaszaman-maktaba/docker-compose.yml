version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: anaszaman-maktaba_web_1
      APP_PORT: 80

  web:
    image: nginx:1.27.3-alpine
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/www:/usr/share/nginx/html:ro
      - ${APP_DATA_DIR}/data/nginx.conf:/etc/nginx/conf.d/default.conf:ro
